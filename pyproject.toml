[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.5.3"  # x-release-please-version
description = "Local replay buffer, editor, and Auto Short for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Knightsaway" }]
dependencies = [
  "PySide6>=6.7",
  "numpy>=1.26",
  "soundcard>=0.4.4",
]

[project.optional-dependencies]
captions = ["faster-whisper", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
voice = ["piper-tts"]
dev = ["pytest>=8.0", "ruff>=0.6", "pyinstaller>=6.0"]

[project.scripts]
clipforge = "clipforge.app:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Catch real bugs, not style churn: syntax errors, pyflakes (unused / undefined names) and bugbear.
select = ["E9", "F", "B"]
ignore = [
  "B007",  # unused loop variable: style only
  "B905",  # zip() without strict=: style only, and strict= would change behaviour
]
