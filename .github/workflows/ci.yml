name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps for soundcard and offscreen Qt + Qt Multimedia (Studio tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q clipforge

      - name: Import
        run: python -c "import clipforge; print(clipforge.__version__)"

      - name: Lint
        run: ruff check clipforge tests

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke
        run: |
          python -m compileall -q clipforge
          python -c "import clipforge; print(clipforge.__version__)"
          pytest -q --tb=short -rf 2>&1 | Tee-Object pytest.txt
          if ($LASTEXITCODE -ne 0) {
            $f = (Get-Content pytest.txt | Select-String "^(FAILED|ERROR|E  )" | Select-Object -First 20) -join "%0A"
            Write-Host "::error title=pytest on Windows::$f"
            exit 1
          }
