name: Windows build check

# Runs the real release build (PyInstaller + vendored FFmpeg) on PRs that touch the build,
# so a broken build shows up before a release is cut instead of after.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "ClipForge.spec"
      - "requirements.lock"
      - "clipforge/selftest.py"
      - "clipforge/updater.py"
      - "clipforge/memreport.py"
      - "clipforge/perf.py"
      - "clipforge/ui/**"
      - "clipforge/voices.py"
      - "clipforge/commentator.py"
      - "installer/**"
      - "assets/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build onedir + vendor FFmpeg
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Natural voice add-on inside the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ClipForge\ClipForge.exe -ArgumentList "--install-voice" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Error "voice download timed out"; exit 1 }
          if ($p.ExitCode -ne 0) {
            $l = Join-Path $env:APPDATA "ClipForge\clipforge.log"
            "::error title=Voice add-on::install failed%0A" + (((Get-Content $l -Tail 20 -ErrorAction SilentlyContinue)) -join "%0A")
            exit 1
          }
          $r = Join-Path $env:TEMP "voice-selftest.txt"
          $p = Start-Process dist\ClipForge\ClipForge.exe -ArgumentList "--selftest", "`"$r`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "voice self-test timed out"; exit 1 }
          $t = Get-Content $r -Raw
          "::notice title=Voice add-on::" + ($t -replace "`r?`n", "%0A")
          if ($p.ExitCode -ne 0 -or $t -notmatch "ok    voice") { exit 1 }

      - name: Memory in real situations (400-clip library)
        shell: pwsh
        run: |
          $lib = Join-Path $env:USERPROFILE "Videos\ClipForge\Desktop"
          New-Item -ItemType Directory -Force $lib | Out-Null
          $ff = "dist\ClipForge\ffmpeg\bin\ffmpeg.exe"
          & $ff -v error -y -f lavfi -i "testsrc2=size=1920x1080:rate=60" -f lavfi -i "sine=frequency=440" -t 4 -c:v libx264 -preset ultrafast -crf 35 -c:a aac "$env:TEMP\tiny.mp4"
          1..400 | ForEach-Object { Copy-Item "$env:TEMP\tiny.mp4" (Join-Path $lib ("Desktop 2026-10-{0:00} 12-{1:00}-{2:00} Clip {3}.mp4" -f (1 + $_ % 28), ($_ % 60), ($_ % 50), $_)) }
          $r = Join-Path $env:TEMP "memreport.txt"
          $p = Start-Process dist\ClipForge\ClipForge.exe -ArgumentList "--memreport", "`"$r`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill() }
          $t = if (Test-Path $r) { Get-Content $r -Raw } else { "(no report)" }
          "::notice title=Memory::" + ($t -replace "`r?`n", "%0A")
          $tray = [regex]::Match($t, "in the tray: in RAM (\d+)").Groups[1].Value
          if (-not $tray) { Write-Error "memory report incomplete"; exit 1 }
          if ([int]$tray -gt 350) { Write-Error "ClipForge holds $tray MB in the tray (limit 350)"; exit 1 }

      - name: Build and test the installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Self-test from source (for comparison)
        if: always()
        shell: pwsh
        run: |
          pip install -r requirements.lock | Out-Null
          $r = Join-Path $env:TEMP "src-selftest.txt"
          $p = Start-Process python -ArgumentList "-m", "clipforge", "--selftest", "`"$r`"" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); $t = "TIMED OUT`n" }
          $t += if (Test-Path $r) { Get-Content $r -Raw } else { "(no report)" }
          "::notice title=Source self-test::" + ($t -replace "`r?`n", "%0A")

      - name: Check the bundle
        shell: pwsh
        run: |
          foreach ($f in "ClipForge.exe", "VERSION", "ffmpeg\bin\ffmpeg.exe", "THIRD_PARTY_NOTICES.md") {
            if (-not (Test-Path "dist\ClipForge\$f")) { Write-Error "missing $f"; exit 1 }
          }
          Get-Content dist\ClipForge\VERSION
          Compress-Archive -Path dist\ClipForge -DestinationPath check.zip -Force
          $zip = (Get-Item check.zip).Length / 1MB
          $dir = ((Get-ChildItem dist\ClipForge -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          "::notice title=Size::Release zip {0:N0} MB, unpacked {1:N0} MB" -f $zip, $dir

      - name: Diagnose with a console build
        if: failure()
        shell: pwsh
        env:
          CLIPFORGE_CONSOLE: "1"
        run: |
          python -m PyInstaller --noconfirm --distpath dist_console ClipForge.spec *> pyi.txt
          Copy-Item -Recurse ffmpeg dist_console\ClipForge\ffmpeg -ErrorAction SilentlyContinue
          $r = Join-Path $env:TEMP "con-selftest.txt"
          $p = Start-Process dist_console\ClipForge\ClipForge.exe -ArgumentList "--selftest", "`"$r`"" -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMED OUT" | Add-Content err.txt }
          $t = "exit=$($p.ExitCode)`n--- report ---`n" + $(if (Test-Path $r) { Get-Content $r -Raw } else { "(none)" })
          $t += "`n--- stderr ---`n" + ((Get-Content err.txt -Tail 40) -join "`n")
          $t += "`n--- stdout ---`n" + ((Get-Content out.txt -Tail 15) -join "`n")
          "::notice title=Console run::" + ($t -replace "`r?`n", "%0A")
          $w = Get-ChildItem build -Recurse -Filter "warn-*.txt" | Select-Object -First 1
          if ($w) { "::notice title=Missing modules::" + (((Get-Content $w.FullName) | Select-String "top-level|delayed" | Select-Object -First 25) -join "%0A") }
