name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN tag/release events do not start other workflows — build here when a release is cut.
  windows-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build onedir + vendor FFmpeg
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Zip win64 artifact
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          if (-not $ver) { $ver = (Get-Content dist\ClipForge\VERSION -Raw).Trim() }
          $name = "ClipForge-$ver-win64"
          New-Item -ItemType Directory -Force "dist_release\$name" | Out-Null
          Copy-Item -Recurse "dist\ClipForge\*" "dist_release\$name\"
          Compress-Archive -Path "dist_release\$name" -DestinationPath "dist_release\$name.zip" -Force
          Get-FileHash -Algorithm SHA256 "dist_release\$name.zip", "dist_release\ClipForge-*-setup.exe" |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii "dist_release\SHA256SUMS"
          Get-Content "dist_release\SHA256SUMS"
          "ASSET_VER=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" \
            dist_release/*.zip \
            dist_release/*-setup.exe \
            dist_release/SHA256SUMS \
            --clobber
          NOTES=$(gh release view "$TAG" --json body -q .body)
          {
            echo "$NOTES"
            echo ""
            echo "## Downloads"
            echo "- **\`ClipForge-${ASSET_VER}-setup.exe\`** — installer (recommended): Start menu + desktop shortcut, uninstall from Windows settings, no admin needed."
            echo "- \`ClipForge-${ASSET_VER}-win64.zip\` — portable app (ClipForge.exe + vendored FFmpeg); unzip anywhere you can write to."
            echo "- Windows may say \"Windows protected your PC\" because ClipForge isn't code-signed yet: click **More info → Run anyway**."
            echo "  See THIRD_PARTY_NOTICES.md inside for GPL/LGPL notices."
          } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
